<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <title>DiffTheory — Beyond The Stats</title>

    <script>
        const pathSegmentsToKeep = 0;

        const locationData =
            window.location;

        const redirectPath =
            locationData.pathname
                .split("/")
                .slice(
                    1 + pathSegmentsToKeep,
                )
                .join("/")
                .replace(
                    /&/g,
                    "~and~",
                );

        const preservedPath =
            locationData.pathname
                .split("/")
                .slice(
                    0,
                    1 + pathSegmentsToKeep,
                )
                .join("/");

        locationData.replace(
            locationData.protocol
            + "//"
            + locationData.hostname
            + (
                locationData.port
                    ? ":"
                      + locationData.port
                    : ""
            )
            + preservedPath
            + "/?/"
            + redirectPath
            + (
                locationData.search
                    ? "&"
                      + locationData.search.slice(1)
                          .replace(
                              /&/g,
                              "~and~",
                          )
                    : ""
            )
            + locationData.hash
        );
    </script>
</head>

<body>
</body>
</html>
